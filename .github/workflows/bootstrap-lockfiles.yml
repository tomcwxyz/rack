name: Bootstrap lockfiles

on:
  push:
    branches: [feat/iteration-1-foundation]

permissions:
  contents: write

jobs:
  lockfiles:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/iteration-1-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit generated lockfiles
        run: |
          if git diff --quiet -- pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock && git ls-files --error-unmatch pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock >/dev/null 2>&1; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore: pin JavaScript and Rust dependencies"
          git push origin HEAD:feat/iteration-1-foundation
