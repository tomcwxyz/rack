name: Recover Iteration 12 lockfile

on:
  push:
    branches: [agent/iteration-12-recovery]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Refresh exact lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit lockfile and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/i12-lockfile-recovery.yml
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Iteration 12 lockfile"
          git push origin HEAD:agent/iteration-12-recovery
