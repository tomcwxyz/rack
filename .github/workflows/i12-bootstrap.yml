name: Bootstrap Iteration 12 lockfile

on:
  push:
    branches: [feat/iteration-12-model-execution]

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: 79781c933c5726b9eb967e8f8cb76fbfabffb4e5
      ITERATION_TREE: ba36a52037824449ff51b0b8cd34ebaa4d5501ac
      BRANCH: feat/iteration-12-model-execution
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish prepared Iteration 12 tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload="$(jq -nc --arg message 'Iteration 12: Confirmed model execution and atomic budget reservation' --arg tree "$ITERATION_TREE" --arg parent "$BASE_SHA" '{message:$message,tree:$tree,parents:[$parent]}')"
          commit_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - <<<"$payload" --jq .sha)"
          ref_payload="$(jq -nc --arg sha "$commit_sha" '{sha:$sha,force:true}')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --input - <<<"$ref_payload" >/dev/null
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Generate exact lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Amend clean commit with lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:"$BRANCH"
