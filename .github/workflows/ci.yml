name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type checks and tests
    runs-on: ubuntu-latest
    outputs:
      desktop_changed: ${{ steps.desktop-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect desktop-related changes
        id: desktop-changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed_files"

          if grep -Eq '^(apps/desktop/|packages/(core|schemas|starter)/|scripts/|package\.json$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|turbo\.json$)' <<< "$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  desktop-windows:
    name: Desktop smoke (Windows)
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      needs.quality.outputs.desktop_changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rack/desktop... build
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml document_import::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml topo_local::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml host_discovery::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml host_install::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml repository_checks::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml work_target::tests

  desktop-linux:
    name: Desktop smoke and package (Linux)
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      needs.quality.outputs.desktop_changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rack/desktop... build
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml document_import::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml topo_local::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml host_discovery::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml host_install::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml repository_checks::tests
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml work_target::tests
      - name: Build Linux pilot packages
        env:
          CI: true
        run: pnpm --filter @rack/desktop tauri build --bundles deb,appimage

  desktop-macos:
    name: Desktop smoke (macOS)
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      needs.quality.outputs.desktop_changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rack/desktop... build
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
