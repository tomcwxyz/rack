name: Windows test installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-test-installer.yml"

concurrency:
  group: rack-windows-test-installer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Rack Windows test installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Windows-safe desktop release version
        run: pnpm --filter @rack/desktop exec vitest run src/releaseVersion.test.ts

      - name: Build unsigned Windows installer and draft test release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          projectPath: apps/desktop
          tagName: rack-test-${{ github.run_number }}
          releaseName: "Rack Windows test · run ${{ github.run_number }}"
          releaseBody: |
            Windows test installer built from current Rack main for hands-on loop testing.

            This is an unsigned development/test build. Windows SmartScreen may warn before installation.

            No Node, pnpm, Rust or Cargo installation is required to run this packaged desktop app.
          releaseDraft: true
          prerelease: true
          releaseAssetNamePattern: "Rack_Windows_Test_[version]_[arch][setup][ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: "--bundles nsis"

      - name: Install and launch packaged Rack
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Rack NSIS installer was not produced."
          }

          & $installer.FullName /S
          if ($LASTEXITCODE -ne 0) {
            throw "Rack NSIS silent install failed with exit code $LASTEXITCODE."
          }

          Start-Sleep -Seconds 3

          $candidates = @(
            "$env:LOCALAPPDATA\Rack\Rack.exe",
            "$env:LOCALAPPDATA\Programs\Rack\Rack.exe",
            "$env:LOCALAPPDATA\uk.co.good-ship.rack\Rack.exe"
          )
          $app = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) {
            $found = Get-ChildItem $env:LOCALAPPDATA -Filter "Rack.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            $app = $found?.FullName
          }
          if (-not $app) {
            throw "Rack installed but Rack.exe could not be located under LOCALAPPDATA."
          }

          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            $log = "$env:LOCALAPPDATA\Rack\logs\startup.log"
            if (Test-Path $log) {
              Write-Host "Rack startup log:"
              Get-Content $log
            }
            throw "Installed Rack exited during the startup smoke test with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Installed Rack remained running through the startup smoke window."
